org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true
kapt.use.worker.api=true
kapt.incremental.apt=true

# Java 17 is required for KAPT compatibility
# Uncomment ONE of the following based on your OS:

# macOS with Homebrew:
# org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.18/libexec/openjdk.jdk/Contents/Home

# Linux/CI (Adoptium Temurin 17):
# org.gradle.java.home=/home/ubuntu/java/jdk-17.0.11+9
