org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=true
kapt.use.worker.api=true
kapt.incremental.apt=true

# Java 17 is REQUIRED for KAPT compatibility (Java 21+ will fail)
# To find your Java 17 path on macOS, run: /usr/libexec/java_home -v 17
# Then uncomment and update the line below with your path:

# macOS (run: /usr/libexec/java_home -v 17 to get exact path):
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# Alternative macOS paths (uncomment the one that matches your installation):
# org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.18/libexec/openjdk.jdk/Contents/Home
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
